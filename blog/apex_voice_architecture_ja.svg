<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif">
  <title>Apex Voice アーキテクチャ</title>
  <desc>マイク入力からテキスト挿入までの処理パイプラインと、語彙学習・Web連携の補助系を示す構成図。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8a4d4"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Apex Voice — システム構成</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#666">macOS常駐 音声タイピング × AIエージェント</text>

  <rect x="30" y="200" width="840" height="170" rx="14" fill="#fafafa" stroke="#e8e8e8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="222" font-size="11" fill="#888" font-weight="600">メイン処理パイプライン（ローカル・オフライン動作可能）</text>

  <g>
    <rect x="50" y="240" width="160" height="100" rx="10" fill="#ffffff" stroke="#d4c5e8" stroke-width="2"/>
    <text x="130" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">マイク入力</text>
    <text x="130" y="293" text-anchor="middle" font-size="11" fill="#555">内蔵 / 有線 / Bluetooth</text>
    <text x="130" y="312" text-anchor="middle" font-size="10" fill="#888">sounddevice + VAD</text>
    <text x="130" y="328" text-anchor="middle" font-size="10" fill="#888">（RMSベース無音検出）</text>
  </g>

  <g>
    <rect x="240" y="240" width="160" height="100" rx="10" fill="#ffffff" stroke="#9b7cc4" stroke-width="2"/>
    <text x="320" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">mlx-whisper</text>
    <text x="320" y="288" text-anchor="middle" font-size="11" fill="#555">音声 → テキスト</text>
    <text x="320" y="306" text-anchor="middle" font-size="10" fill="#888">large-v3-turbo</text>
    <text x="320" y="322" text-anchor="middle" font-size="10" fill="#9b7cc4" font-weight="600">Apple Silicon</text>
  </g>

  <g>
    <rect x="430" y="240" width="160" height="100" rx="10" fill="#fff7ed" stroke="#ff9900" stroke-width="2"/>
    <text x="510" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Amazon Bedrock</text>
    <text x="510" y="288" text-anchor="middle" font-size="11" fill="#555">後処理（任意）</text>
    <text x="510" y="306" text-anchor="middle" font-size="10" fill="#888">Claude Haiku 4.5</text>
    <text x="510" y="322" text-anchor="middle" font-size="10" fill="#888">整文/敬語/翻訳/箇条書き</text>
  </g>

  <g>
    <rect x="620" y="240" width="220" height="100" rx="10" fill="#ffffff" stroke="#d4c5e8" stroke-width="2"/>
    <text x="730" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">テキスト挿入</text>
    <text x="730" y="288" text-anchor="middle" font-size="11" fill="#555">NSPasteboard → ⌘V</text>
    <text x="730" y="306" text-anchor="middle" font-size="10" fill="#888">osascript / System Events</text>
    <text x="730" y="324" text-anchor="middle" font-size="10" fill="#9b7cc4" font-weight="600">Slack / ブラウザ / メモ など全アプリ</text>
  </g>

  <line x1="210" y1="290" x2="237" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="290" x2="427" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="290" x2="617" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="240" y="100" width="350" height="70" rx="10" fill="#fff7ed" stroke="#ff9900" stroke-width="2"/>
    <text x="415" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Amazon Bedrock AgentCore Memory</text>
    <text x="415" y="145" text-anchor="middle" font-size="11" fill="#555">発話から語彙抽出 → 永続化 → 次回プロンプトに注入</text>
    <text x="415" y="161" text-anchor="middle" font-size="10" fill="#888">使うほどWhisper認識精度が上がる</text>
  </g>
  <line x1="320" y1="240" x2="320" y2="172" stroke="#b8a4d4" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowMuted)"/>
  <line x1="510" y1="172" x2="510" y2="240" stroke="#b8a4d4" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowMuted)"/>

  <g>
    <rect x="240" y="400" width="170" height="80" rx="10" fill="#ffffff" stroke="#9b7cc4" stroke-width="2"/>
    <text x="325" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Strands Agents</text>
    <text x="325" y="445" text-anchor="middle" font-size="11" fill="#555">macOS操作の実行</text>
    <text x="325" y="463" text-anchor="middle" font-size="10" fill="#888">リマインダー/音量/アプリ起動</text>
  </g>
  <line x1="510" y1="340" x2="510" y2="420" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="420" x2="412" y2="420" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="440" y="400" width="400" height="80" rx="10" fill="#fff7ed" stroke="#ff9900" stroke-width="2"/>
    <text x="640" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Apex Voice Web</text>
    <text x="640" y="445" text-anchor="middle" font-size="11" fill="#555">履歴表示 + Web検索要約（クラウド連携）</text>
    <text x="640" y="463" text-anchor="middle" font-size="10" fill="#888">Vercel (Next.js / Python) + Upstash Redis + Bedrock</text>
  </g>
  <line x1="730" y1="340" x2="730" y2="397" stroke="#b8a4d4" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowMuted)"/>

  <g transform="translate(50, 510)">
    <rect x="0" y="0" width="14" height="14" fill="#ffffff" stroke="#9b7cc4" stroke-width="2" rx="3"/>
    <text x="22" y="11" font-size="11" fill="#555">ローカル（macOS）</text>
    <rect x="160" y="0" width="14" height="14" fill="#fff7ed" stroke="#ff9900" stroke-width="2" rx="3"/>
    <text x="182" y="11" font-size="11" fill="#555">AWS / クラウド</text>
    <line x1="320" y1="7" x2="345" y2="7" stroke="#666" stroke-width="2"/>
    <text x="352" y="11" font-size="11" fill="#555">必須フロー</text>
    <line x1="430" y1="7" x2="455" y2="7" stroke="#b8a4d4" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="462" y="11" font-size="11" fill="#555">補助フロー（任意）</text>
  </g>
</svg>
